spring:
  application:
    name: api-boraviajar
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://127.0.0.1:3306/boraviajar_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

server:
  port: ${PORT:8080}

# Mesmo JWT_SECRET que o site Node (se ainda existir) — sessão HS256
boraviajar:
  jwt:
    secret: ${JWT_SECRET:changeme-use-same-as-node-backend}
  auth0:
    domain: ${AUTH0_DOMAIN:}
    client-id: ${AUTH0_CLIENT_ID:}
  vapid:
    public-key: ${VAPID_PUBLIC_KEY:}

springdoc:
  api-docs:
    path: /api/v1/docs/openapi
  swagger-ui:
    path: /api/v1/docs/swagger-ui.html

logging:
  level:
    org.hibernate.SQL: WARN
    com.boraviajar: INFO
